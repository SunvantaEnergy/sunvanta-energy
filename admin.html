<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunvanta Energy | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#202b38}
header{background:#102b46;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;font-size:21px}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.panel{background:white;padding:24px;border-radius:12px;margin-bottom:22px;box-shadow:0 2px 12px #0000000a}
h3{margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #d5dce3;border-radius:7px;font-size:15px}
textarea{min-height:90px}
button{border:0;border-radius:7px;padding:11px 17px;background:#e5a52b;color:#172b40;font-weight:bold;cursor:pointer;margin:4px}
button.secondary{background:#e8edf2;color:#26394d}
button.danger{background:#f8dddd;color:#9c2525}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{border:1px solid #e1e6eb;padding:15px;border-radius:9px;margin:12px 0;display:flex;gap:15px;align-items:center}
.product img{width:85px;height:85px;object-fit:contain;background:#f5f6f7;border-radius:6px}
.product-info{flex:1}
.muted{color:#738092;font-size:13px}
.hidden{display:none}
#message{margin:12px 0;color:#23633a}
@media(max-width:650px){.row{grid-template-columns:1fr}.product{align-items:flex-start}.product img{width:65px;height:65px}}
</style>
</head>
<body>
<header>
  <h2>Sunvanta Energy · Admin</h2>
  <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log out</button>
</header>

<main>
  <section class="panel" id="loginPanel">
    <h3>Administrator Login</h3>
    <label>Email</label>
    <input id="email" type="email" value="3487217845@qq.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter your password">
    <button onclick="login()">Log in</button>
    <p id="loginMessage" class="muted"></p>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="panel">
      <h3 id="formTitle">Add a Product</h3>
      <input type="hidden" id="productId">

      <label>Product Name *</label>
      <input id="name" placeholder="e.g. Deye 5kW Hybrid Inverter">

      <div class="row">
        <div>
          <label>Brand</label>
          <input id="brand" placeholder="Deye">
        </div>
        <div>
          <label>Model</label>
          <input id="model" placeholder="SUN-5K-SG06LP1-EU-CM2">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Category</label>
          <select id="category">
            <option>Solar Inverters</option>
            <option>Solar Panels</option>
            <option>Lithium Batteries</option>
            <option>Energy Storage Systems</option>
            <option>Wind Turbines</option>
            <option>Other Products</option>
          </select>
        </div>
        <div>
          <label>Power / Capacity</label>
          <input id="power" placeholder="5kW">
        </div>
      </div>

      <label>Description</label>
      <textarea id="description" placeholder="Product specifications and details"></textarea>

      <label>Product Image</label>
      <input id="imageFile" type="file" accept="image/*">
      <p class="muted">Upload a real product photo. JPG, PNG or WebP recommended.</p>

      <button onclick="saveProduct()">Save Product</button>
      <button class="secondary" onclick="resetForm()">Clear</button>
      <p id="message"></p>
    </div>

    <div class="panel">
      <h3>Product Management</h3>
      <button class="secondary" onclick="loadProducts()">Refresh List</button>
      <div id="productList">Loading products...</div>
    </div>
  </section>
</main>

<script>
// Fill these two values using your Supabase project settings.
const SUPABASE_URL = "https://lwqxwsxhgopiubknjtnp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_J2GEOxIuBbuS7xHm7USVTw_MFqFDgZ1";

const ADMIN_UID = "d11f2af2-efd4-49c4-baab-51f84569ddfa";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("loginMessage");
  msg.textContent = "Signing in...";

  const {data,error} = await db.auth.signInWithPassword({email,password});
  if(error){msg.textContent = error.message;return;}

  if(data.user.id !== ADMIN_UID){
    await db.auth.signOut();
    msg.textContent = "This account is not authorized as administrator.";
    return;
  }
  showAdmin();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

function showAdmin(){
  document.getElementById("loginPanel").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");
  loadProducts();
}

async function checkSession(){
  const {data} = await db.auth.getSession();
  if(data.session){
    if(data.session.user.id === ADMIN_UID) showAdmin();
    else await db.auth.signOut();
  }
}

async function loadProducts(){
  const list = document.getElementById("productList");
  list.textContent = "Loading...";

  const {data,error} = await db.from("products")
    .select("*").order("created_at",{ascending:false});

  if(error){list.textContent = error.message;return;}
  if(!data.length){list.textContent = "No products yet. Add your first product above.";return;}

  list.innerHTML = "";
  data.forEach(p=>{
    const item = document.createElement("div");
    item.className = "product";

    const img = document.createElement("img");
    img.src = p.image_url || "";
    img.alt = p.name || "Product image";

    const info = document.createElement("div");
    info.className = "product-info";

    const title = document.createElement("strong");
    title.textContent = p.name;

    const details = document.createElement("p");
    details.className = "muted";
    details.textContent = [p.brand,p.model,p.power].filter(Boolean).join(" · ");

    const status = document.createElement("p");
    status.className = "muted";
    status.textContent = p.published ? "Published" : "Draft";

    info.append(title,details,status);

    const actions = document.createElement("div");
    actions.innerHTML = `
      <button class="secondary" onclick="editProduct(${p.id})">Edit</button>
      <button onclick="togglePublish(${p.id},${!p.published})">${p.published ? "Unpublish" : "Publish"}</button>
      <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
    `;

    item.append(img,info,actions);
    list.appendChild(item);
  });
}

async function saveProduct(){
  const msg = document.getElementById("message");
  msg.textContent = "Saving...";

  const id = document.getElementById("productId").value;
  const name = document.getElementById("name").value.trim();
  if(!name){msg.textContent = "Please enter a product name.";return;}

  let imageUrl = window.currentImageUrl || null;
  const file = document.getElementById("imageFile").files[0];

  if(file){
    const ext = file.name.split(".").pop().toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const {error:uploadError} = await db.storage.from("product-images").upload(path,file);
    if(uploadError){msg.textContent = uploadError.message;return;}
    const {data:urlData} = db.storage.from("product-images").getPublicUrl(path);
    imageUrl = urlData.publicUrl;
  }

  const product = {
    name,
    brand:document.getElementById("brand").value.trim(),
    model:document.getElementById("model").value.trim(),
    category:document.getElementById("category").value,
    power:document.getElementById("power").value.trim(),
    description:document.getElementById("description").value.trim(),
    image_url:imageUrl
  };

  let result;
  if(id) result = await db.from("products").update(product).eq("id",id);
  else result = await db.from("products").insert(product);

  if(result.error){msg.textContent = result.error.message;return;}
  msg.textContent = "Product saved successfully.";
  resetForm();
  loadProducts();
}

async function editProduct(id){
  const {data,error} = await db.from("products").select("*").eq("id",id).single();
  if(error){alert(error.message);return;}

  document.getElementById("productId").value = data.id;
  document.getElementById("name").value = data.name || "";
  document.getElementById("brand").value = data.brand || "";
  document.getElementById("model").value = data.model || "";
  document.getElementById("category").value = data.category || "Solar Inverters";
  document.getElementById("power").value = data.power || "";
  document.getElementById("description").value = data.description || "";
  window.currentImageUrl = data.image_url || null;
  document.getElementById("formTitle").textContent = "Edit Product";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function togglePublish(id,published){
  const {error} = await db.from("products").update({published}).eq("id",id);
  if(error){alert(error.message);return;}
  loadProducts();
}

async function deleteProduct(id){
  if(!confirm("Delete this product? This cannot be undone.")) return;
  const {error} = await db.from("products").delete().eq("id",id);
  if(error){alert(error.message);return;}
  loadProducts();
}

function resetForm(){
  ["productId","name","brand","model","power","description","imageFile"].forEach(id=>{
    document.getElementById(id).value = "";
  });
  document.getElementById("category").value = "Solar Inverters";
  document.getElementById("formTitle").textContent = "Add a Product";
  window.currentImageUrl = null;
}

checkSession();
</script>
</body>
</html>
